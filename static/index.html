<!DOCTYPE html>

  <!-- Modern theme -->

  <link rel="stylesheet" href="/static/css/style.css" />

  <style>

    html, body {
      height: 100%;
      overflow-y: auto;
      margin: 0;
      padding: 0;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    body > *:not(.bg-video) {
      position: relative;
      z-index: 1;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }

    .forgot-link {
      display: block;
      margin-top: 10px;
      text-align: center;
      font-size: 0.9rem;
    }

    /* COPYRIGHT FOOTER */

    .copyright-footer {

      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);

      width: 95%;

      text-align: center;

      font-size: 13px;
      color: rgba(255,255,255,0.75);

      z-index: 5;

      letter-spacing: 0.5px;

      user-select: none;

    }

    /* WATERMARK */

    .watermark {

      position: fixed;

      bottom: 40px;
      right: 25px;

      font-size: 38px;
      font-weight: bold;

      color: rgba(255,255,255,0.05);

      transform: rotate(-18deg);

      pointer-events: none;

      z-index: 1;

      user-select: none;

    }

    @media(max-width:768px){

      .copyright-footer{

        font-size: 11px;
        padding: 0 10px;

      }

      .watermark{

        font-size: 24px;

      }

    }

  </style>

</head>

<body>

  <!-- BACKGROUND VIDEO -->

  <video id="bgVideo" class="bg-video" autoplay muted loop playsinline>
    <source src="/static/img/signvideo-bg.mp4?v=1" type="video/mp4">
  </video>

  <!-- WATERMARK -->

  <div class="watermark">
    SecureVault
  </div>

  <!-- CONTENT -->

  <div class="container">

  <!-- AUTH JS -->

  <script src="/static/js/auth.js"></script>

  <!-- Slow video -->

  <script>

    window.addEventListener("load", function () {

      const video = document.getElementById("bgVideo");

      if (video) {

        video.playbackRate = 0.7;

      }

    });

  </script>

  <!-- WAKE REQUEST + LOGIN WRAPPER -->

  <script>

    async function loginWithWake() {

      try {

        // wake render backend

        fetch("https://pqc-dashboard.onrender.com/", {

          method: "GET",
          mode: "no-cors"

        }).catch(() => {});

        // small delay for cold start

        await new Promise(r => setTimeout(r, 800));

        // call original login function

        login();

      } catch (e) {

        login();

      }

    }

  </script>

</body>
