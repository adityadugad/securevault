    /* Main layout + GIF background */
    .main {
      margin-left: 240px;
      width: calc(100% - 240px);
      box-sizing: border-box;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;

      background:

        url('/static/img/module-bggif.gif');

      background-size: cover;
      background-position: center;
    }

    .todo-wrapper {
      width: 100%;
      max-width: 500px;
    }

    .todo-row {
      display: flex;
      gap: 10px;
    }

    .todo-row input[type="text"] {
      flex: 2;
    }

    .todo-row input[type="date"] {
      flex: 1;
    }

    .center-btn {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }

    /* Center heading */

    .todo-heading {
      text-align: center;
    }

    /* COPYRIGHT FOOTER */

    .copyright-footer {

      position: fixed;

      bottom: 10px;
      left: 50%;

      transform: translateX(-50%);

      width: 95%;

      text-align: center;

      font-size: 12px;

      color: rgba(255,255,255,0.78);

      z-index: 999;

      letter-spacing: 0.4px;

      user-select: none;

      pointer-events: none;

    }

    /* WATERMARK */

    .watermark {

      position: fixed;

      bottom: 45px;
      right: 20px;

      font-size: 34px;
      font-weight: bold;

      color: rgba(255,255,255,0.05);

      transform: rotate(-18deg);

      z-index: 1;

      pointer-events: none;

      user-select: none;

    }

    @media(max-width:768px){

      .copyright-footer{

        font-size: 10px;
        padding: 0 10px;

      }

      .watermark{

        font-size: 22px;

      }

    }

  </style>

</head>

  <!-- HELPER FUNCTION -->

  <script>

    function prepareAndSaveTodo() {

      const taskInput = document.getElementById("todoTask");

      const dateInput = document.getElementById("todoDate");

      if (dateInput.value) {

        const d = new Date(dateInput.value);

        const formattedDate =
          d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear().toString().slice(-2);

        taskInput.value =
          taskInput.value + " on or before " + formattedDate;

      }

      saveTodo();

    }

  </script>
