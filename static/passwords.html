<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SecureVault • Password Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/css/style.css" />

  <!-- SMALL, SAFE OVERRIDES -->

  <style>

    .main {
      margin-left: 240px;
      width: calc(100% - 240px);
      box-sizing: border-box;
      min-height: 100vh;

      background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85)),
        url('/static/img/module-bggif.gif');

      background-size: cover;
      background-position: center;
    }

    /* Center add-password card */

    .center-card {
      display: flex;
      justify-content: center;
    }

    .center-card .card {
      width: 100%;
      max-width: 700px;
    }

    .password-heading {
      text-align: center;
    }

    /* strength text */

    .strength-text {
      margin-top: 6px;
      font-size: 0.9rem;
    }

    /* PASSWORD LIST */

    .password-list-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 24px;
      padding-bottom: 40px;
    }

    .password-list-wrapper .grid {
      width: 100%;
      max-width: 1100px;
    }

    /* COPYRIGHT FOOTER */

    .copyright-footer {

      position: fixed;

      bottom: 10px;
      left: 50%;

      transform: translateX(-50%);

      width: 95%;

      text-align: center;

      font-size: 12px;

      color: rgba(255,255,255,0.78);

      z-index: 999;

      letter-spacing: 0.4px;

      user-select: none;

      pointer-events: none;

    }

    /* WATERMARK */

    .watermark {

      position: fixed;

      bottom: 45px;
      right: 20px;

      font-size: 34px;
      font-weight: bold;

      color: rgba(255,255,255,0.05);

      transform: rotate(-18deg);

      z-index: 1;

      pointer-events: none;

      user-select: none;

    }

    @media(max-width:768px){

      .copyright-footer{

        font-size: 10px;
        padding: 0 10px;

      }

      .watermark{

        font-size: 22px;

      }

    }

  </style>

</head>

<body onload="requireAuth(); loadPasswords();">

  <!-- WATERMARK -->

  <div class="watermark">
    SecureVault

  <!-- MAIN -->

  <div class="main">

```
<h1 class="password-heading">🔑 Password Vault</h1>

<p class="muted password-heading">
  Passwords are encrypted using PQC-backed keys
</p>

<!-- ADD PASSWORD -->

<div class="center-card">

  <div class="card" style="margin-bottom:24px">

    <h3>Add Credential</h3>

    <label>Site</label>

    <input id="site" placeholder="example.com" />

    <label>Username</label>

    <input id="username" placeholder="username" />

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="••••••••"
      oninput="checkPasswordStrength(this.value)"
    />

    <div id="strengthText" class="strength-text muted"></div>

    <button class="btn" onclick="savePassword()">
      💾 Save Encrypted Password
    </button>

    <div id="passMsg" class="msg"></div>

  </div>

</div>

<!-- PASSWORD LIST -->

<div class="password-list-wrapper">

  <div class="grid" id="passwordsList"></div>

</div>
